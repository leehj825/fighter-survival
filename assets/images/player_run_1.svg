<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="55" cy="20" r="10" stroke="cyan" stroke-width="4" fill="none"/>
  <line x1="55" y1="30" x2="50" y2="60" stroke="cyan" stroke-width="4"/>
  <!-- Run 1: Left Leg Forward (bent), Right Leg Back -->
  <line x1="50" y1="60" x2="70" y2="75" stroke="cyan" stroke-width="4"/>
  <line x1="70" y1="75" x2="75" y2="90" stroke="cyan" stroke-width="4"/>

  <line x1="50" y1="60" x2="30" y2="75" stroke="cyan" stroke-width="4"/>
  <line x1="30" y1="75" x2="20" y2="65" stroke="cyan" stroke-width="4"/>

  <!-- Arms: Opposite to legs -->
  <line x1="52" y1="40" x2="30" y2="50" stroke="cyan" stroke-width="4"/>
  <line x1="30" y1="50" x2="40" y2="35" stroke="cyan" stroke-width="4"/>

  <line x1="52" y1="40" x2="75" y2="50" stroke="cyan" stroke-width="4"/>
  <line x1="75" y1="50" x2="80" y2="40" stroke="cyan" stroke-width="4"/>
</svg>
