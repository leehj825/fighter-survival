<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="20" r="10" stroke="yellow" stroke-width="4" fill="none"/>
  <line x1="50" y1="30" x2="50" y2="60" stroke="yellow" stroke-width="4"/>
  <!-- Kick Leg -->
  <line x1="50" y1="60" x2="90" y2="50" stroke="yellow" stroke-width="4"/>
  <!-- Standing Leg -->
  <line x1="50" y1="60" x2="50" y2="95" stroke="yellow" stroke-width="4"/>
  <!-- Arms for balance -->
  <line x1="50" y1="40" x2="20" y2="40" stroke="yellow" stroke-width="4"/>
  <line x1="50" y1="40" x2="80" y2="30" stroke="yellow" stroke-width="4"/>
  <!-- Swipe Arc visual? optional -->
  <path d="M 60 40 Q 90 50 80 80" stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
