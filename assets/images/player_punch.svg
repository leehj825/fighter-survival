<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Flying Superman Pose (Horizontal) -->
  <!-- Head Left -->
  <circle cx="20" cy="50" r="10" stroke="yellow" stroke-width="4" fill="none"/>
  <!-- Body Horizontal -->
  <line x1="30" y1="50" x2="70" y2="50" stroke="yellow" stroke-width="4"/>
  <!-- Legs trailing behind -->
  <line x1="70" y1="50" x2="90" y2="40" stroke="yellow" stroke-width="4"/>
  <line x1="70" y1="50" x2="90" y2="60" stroke="yellow" stroke-width="4"/>
  <!-- Punch Arm Forward -->
  <line x1="30" y1="50" x2="100" y2="50" stroke="yellow" stroke-width="4"/>
  <!-- Other Arm Tucked -->
  <line x1="30" y1="50" x2="40" y2="65" stroke="yellow" stroke-width="4"/>
  <line x1="40" y1="65" x2="60" y2="60" stroke="yellow" stroke-width="4"/>
</svg>
